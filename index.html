<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocinas.cloud · Cuestionario para el dueño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#14232f;--mute:#53687a;--line:#cfdbe4;--accent:#1f6f8b;--accent-ink:#fff;--ok:#1b7a4b;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a22;--card:#17262f;--ink:#e8f0f5;--mute:#9db1c0;--line:#2b4050;--accent:#5bb5d3;--accent-ink:#0b1a22;--ok:#5fd09a;--err:#ff8a80}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:12px 0 4px}
.lead{color:var(--mute);margin:0 0 20px;max-width:60ch}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px;font-size:.9rem;color:var(--mute)}
.track{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
fieldset{border:0;margin:28px 0 0;padding:0}
legend{font-size:1.25rem;font-weight:800;padding:0 0 8px;width:100%;border-bottom:2px solid var(--accent);margin-bottom:12px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.q label.t{display:block;font-weight:600;margin-bottom:8px}
textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
textarea{resize:vertical;min-height:72px}
select{margin-top:8px}
.rl{display:block;font-size:.85rem;color:var(--mute);margin-top:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:800;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:14px 22px;width:100%;min-height:50px;margin-top:28px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{margin-top:14px;font-weight:600}
.ok{color:var(--ok)}.err{color:var(--err)}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
<h1>Cocinas.cloud</h1>
<p class="lead">Cuestionario para el dueño. En cada pregunta escribe tu respuesta y marca si el bot puede responder solo o si debe derivar a una persona.</p>
<div class="bar"><span id="count">0 de 0 preguntas respondidas</span><div class="track"><i id="prog"></i></div></div>
<form id="f" novalidate></form>
</main>
<script>
// ===== CONFIGURACIÓN =====
const EMAIL = "cocinas.cloud@gmail.com";
const ENDPOINT = "https://formsubmit.co/ajax/" + EMAIL;
// =========================

const S = [
["Sección 1 · Horarios y ubicación",[
"Horario de apertura y cierre por día (L-J / V / S / D). ¿La cocina cierra antes que el local?",
"¿Abren feriados y domingos? Si depende, ¿quién decide y cuándo avisa?",
"Dirección exacta, referencia (“frente a…”) y link de Google Maps.",
"¿Tienen estacionamiento? ¿Propio o cercano? ¿Gratis o pagado?",
"Metro o paraderos más cercanos."]],
["Sección 2 · Menú y precios",[
"Carta completa con precios (adjuntar archivo o link).",
"Menú ejecutivo: precio, qué incluye, horario en que aplica, ¿cambia a diario?",
"Platos vegetarianos, veganos, sin gluten y sin lactosa (lista).",
"Alérgenos por plato: gluten, lácteos, frutos secos, mariscos, huevo, soya.",
"¿Tienen menú infantil? Precio y contenido.",
"¿Quién actualiza precios y platos agotados, y con qué frecuencia?"]],
["Sección 3 · Reservas",[
"Horario en que se aceptan reservas (si difiere del de apertura).",
"Capacidad total, máximo de personas por mesa, duración promedio de una mesa.",
"¿El bot puede confirmar solo o solo toma nota y tú confirmas?",
"Desde cuántas personas es “grupo grande”. ¿Piden anticipo o menú cerrado? ¿Con cuánta anticipación?",
"Hasta cuándo se puede cancelar o modificar sin costo. ¿Qué pasa con el anticipo?",
"Minutos de tolerancia si el cliente llega tarde. ¿Avisan antes de liberar la mesa?",
"¿Usan hoy alguna agenda (Google Calendar, cuaderno, otra)?"]],
["Sección 4 · Delivery y retiro",[
"Comunas donde reparten, con costo de envío por cada una (tabla).",
"Tiempo estimado en hora normal y en hora punta.",
"Pedido mínimo.",
"Tiempo de preparación para retiro en local.",
"¿Quién reparte? ¿Propio, Uber Direct, Rappi, otro?",
"¿Registran estados del pedido (confirmado / listo / despachado)? Si no, ¿quién responde “dónde está mi pedido”?"]],
["Sección 5 · Pagos",[
"Medios aceptados: tarjeta, transferencia, efectivo.",
"Datos de transferencia completos y correo donde se envía el comprobante.",
"¿Aceptan Sodexo, Edenred, Pluxee u otros vales?",
"¿Emiten boleta siempre? ¿Factura bajo qué condiciones?"]],
["Sección 6 · Eventos y otros",[
"Salón para celebraciones: capacidad, costo o consumo mínimo, anticipación.",
"Política de mascotas (terraza / interior) y si tienen terraza.",
"Acceso para sillas de ruedas.",
"Promociones y happy hour vigentes, con fecha de término.",
"Eventos o música en vivo: ¿quién informa la programación semanal?"]],
["Sección 7 · Reclamos",[
"Pedido frío o incompleto: ¿qué compensan? (reenvío / descuento / devolución).",
"Cobro incorrecto: ¿quién lo revisa?",
"Nombre y número al que el bot debe derivar reclamos y “hablar con el administrador”."]]
];

const f = document.getElementById("f");
const KEY = "cocinas-cloud-borrador";
let draft = {};
try { draft = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}

let total = 0, html = "";
S.forEach((s, i) => {
  html += `<fieldset><legend>${s[0]}</legend>`;
  s[1].forEach((q, j) => {
    const id = `s${i+1}p${j+1}`; total++;
    html += `<div class="q"><label class="t" for="${id}">${j+1}. ${q}</label>
<textarea id="${id}" data-q="${i+1}.${j+1}" data-t="${q.replace(/"/g,'&quot;')}"></textarea>
<span class="rl" id="${id}r-l">Regla del bot</span>
<select id="${id}r" aria-labelledby="${id}r-l">
<option value="">Elegir…</option>
<option>Responde solo</option>
<option>Deriva a persona</option></select></div>`;
  });
  html += `</fieldset>`;
});
html += `<input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
<button type="submit" id="go">Enviar respuestas</button><div id="msg" role="status"></div>`;
f.innerHTML = html;

f.querySelectorAll("textarea,select").forEach(el => {
  if (draft[el.id]) el.value = draft[el.id];
  el.addEventListener("input", save);
});
function save(){
  const d = {};
  f.querySelectorAll("textarea,select").forEach(el => { if (el.value) d[el.id] = el.value; });
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {}
  let n = 0;
  f.querySelectorAll("textarea").forEach(t => { if (t.value.trim()) n++; });
  document.getElementById("count").textContent = `${n} de ${total} preguntas respondidas`;
  document.getElementById("prog").style.width = (n/total*100) + "%";
}
save();

f.addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("msg"), btn = document.getElementById("go");
  if (f.querySelector("[name=_honey]").value) return;
  const data = {
    _subject: "Cocinas.cloud · Cuestionario del dueño",
    _template: "table",
    _captcha: "false"
  };
  let n = 0;
  f.querySelectorAll("textarea").forEach(t => {
    const r = document.getElementById(t.id + "r").value;
    if (!t.value.trim() && !r) return;
    n++;
    const k = `${t.dataset.q} ${t.dataset.t}`.slice(0, 90);
    data[k] = t.value.trim() + (r ? `\n→ Regla del bot: ${r}` : "");
  });
  if (!n) { msg.className = "err"; msg.textContent = "Responde al menos una pregunta antes de enviar."; return; }
  btn.disabled = true; msg.className = ""; msg.textContent = "Enviando…";
  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Accept": "application/json"},
      body: JSON.stringify(data)
    });
    const out = await res.json();
    if (res.ok && String(out.success) === "true") {
      msg.className = "ok";
      msg.textContent = "Respuestas enviadas. Gracias.";
      try { localStorage.removeItem(KEY); } catch(e) {}
    } else {
      throw new Error(out.message || "Error de envío");
    }
  } catch (err) {
    msg.className = "err";
    msg.textContent = "No se pudo enviar: " + err.message + ". Tus respuestas siguen guardadas en este dispositivo; intenta de nuevo.";
  }
  btn.disabled = false;
});
</script>
</body>
</html>
